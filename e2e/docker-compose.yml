services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invoicetrackr_e2e
      POSTGRES_PASSWORD: invoicetrackr
      POSTGRES_USER: invoicetrackr
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoicetrackr -d invoicetrackr_e2e']
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
