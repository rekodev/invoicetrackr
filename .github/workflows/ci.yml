name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoicetrackr_e2e
          POSTGRES_PASSWORD: invoicetrackr
          POSTGRES_USER: invoicetrackr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoicetrackr -d invoicetrackr_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      API_RATE_LIMIT_MAX: '1000'
      APP_BASE_URL: http://127.0.0.1:3100
      AUTH_SECRET: invoicetrackr-e2e-auth-secret-32-chars
      AUTH_URL: http://127.0.0.1:3100
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://invoicetrackr:invoicetrackr@127.0.0.1:5432/invoicetrackr_e2e
      E2E_BASE_URL: http://127.0.0.1:3100
      EMAIL_TRANSPORT: capture
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      NODE_ENV: development
      RESEND_EMAIL_API_KEY: re_e2e_placeholder
      SERVER_PORT: 5100

    steps:
      - name: Clone Repository
        # TODO: Upgrade to actions/checkout@v5 once the Node 24-backed release is available.
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared packages
        run: |
          pnpm run types build
          pnpm run emails build
          pnpm run pdf build

      - name: Prepare E2E database
        run: pnpm e2e:db:prepare

      - name: Build applications
        env:
          NODE_ENV: production
        run: |
          pnpm run server build
          pnpm run client build

      - name: Run Playwright tests
        env:
          NODE_ENV: production
        run: pnpm test:e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
