name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoicetrackr_e2e
          POSTGRES_PASSWORD: invoicetrackr
          POSTGRES_USER: invoicetrackr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoicetrackr -d invoicetrackr_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_BASE_URL: http://127.0.0.1:3100
      AUTH_SECRET: invoicetrackr-e2e-auth-secret-32-chars
      AUTH_URL: http://127.0.0.1:3100
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://invoicetrackr:invoicetrackr@127.0.0.1:5432/invoicetrackr_e2e
      E2E_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      NODE_ENV: development
      RESEND_EMAIL_API_KEY: re_e2e_placeholder
      SERVER_PORT: 5100

    steps:
      - name: Clone Repository
        # TODO: Upgrade to actions/checkout@v5 once the Node 24-backed release is available.
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared packages
        run: |
          pnpm run types build
          pnpm run emails build

      - name: Prepare E2E database
        run: pnpm e2e:db:prepare

      - name: Run Playwright tests
        run: pnpm test:e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Build and deploy
    needs: e2e
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        # TODO: Upgrade to actions/checkout@v5 once the Node 24-backed release is available.
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker image build \
          --build-arg SERVER_PORT=${{ secrets.SERVER_PORT }} \
          --build-arg NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }} \
          --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} \
          --build-arg NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }} \
          -t invoicetrackr:${{ github.sha }} .

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh/
          touch ~/.ssh/key
          echo "${{ secrets.INVOICETRACKR_SECRET }}" > ~/.ssh/key
          chmod 400 ~/.ssh/key
          ssh-keyscan ${{ secrets.PROD_IP_ADDRESS }} >> ~/.ssh/known_hosts

      - name: Push Docker image to Production
        run: docker image save invoicetrackr:${{ github.sha }} | ssh dokku@${{ secrets.PROD_IP_ADDRESS }} -i ~/.ssh/key git:load-image invoice-app invoicetrackr:${{ github.sha }}
