packages:
  - client
  - server
  - shared/types
  - shared/emails
  - shared/pdf
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  '@tailwindcss/oxide': true
  better-sqlite3: true
  bufferutil: true
  core-js: true
  esbuild: true
  sharp: true
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  next: 16.4.2
publicHoistPattern:
  - '*@heroui/*'
verifyDepsBeforeRun: false
forceLegacyDeploy: true
patchedDependencies:
  '@react-pdf/hyphenate@0.1.0': patches/@react-pdf__hyphenate@0.1.0.patch
